<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./assets/icones/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Criar</title>

    <link rel="stylesheet" href="./assets/css/styleGeral.css">
    <link rel="stylesheet" href="./assets/css/loginStyle.css">
    <link rel="stylesheet" href="./assets/css/responsividade.css">
    <link rel="stylesheet" href="./assets/css/navbar.css">
    
</head>
<body>       
    <!-- Menu navegação inicio -->    
    <script type="module" src="./js/navbar.js"></script>

    <div class="mainLogin">
        <div class="login-box">
            <h2>Criar Conta</h2>
            <form id="criarForm">
                <input type="text" id="username" name="solicitante" placeholder="Usuário" required>
                <input type="text" id="estudio" name="estudio" placeholder="Nome do seu Estúdio" readonly required>
                <input type="email" id="email" name="email" placeholder="E-mail" required>
                <input type="password" id="password" name="senha" placeholder="Senha" required>
                <button class="btnLogin" type="submit">Criar</button>
            </form>
        <div class="msg" id="msg"></div>
        </div>
    </div>
    
    <!-- Modal de Seleção/Criação de Estúdio -->
    <div id="estudioModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Selecione ou Crie um Estúdio</h3>
                <button type="button" class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="estudioSearch" class="estudio-search" placeholder="Buscar ou digitar nome do estúdio...">
                <div class="estudio-list" id="estudioList"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="modalCancelBtn">Cancelar</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="./js/estudioModalManager.js"></script>
    <script type="module" src="./js/loginCriar.js"></script>
</body>
</html>
