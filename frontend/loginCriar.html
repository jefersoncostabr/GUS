<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Criar</title>

    <link rel="stylesheet" href="./assets/css/styleGeral.css">
    <link rel="stylesheet" href="./assets/css/loginStyle.css">
    <link rel="stylesheet" href="./assets/css/responsividade.css">
    <link rel="stylesheet" href="./assets/css/navbar.css">
    
</head>
<body>       
    <!-- Menu navegação inicio -->    
    <script type="module" src="./js/navbar.js"></script>

    <div class="mainLogin">
        <div class="login-box">
            <h2>Criar Conta</h2>
            <form id="criarForm">
                <input type="text" id="username" name="solicitante" placeholder="Usuário" required>
                <select id="estudio" name="estudio" required>
                    <option value="" disabled selected>Selecione o estúdio</option>
                </select>
                <input type="email" id="email" name="email" placeholder="E-mail" required>
                <input type="password" id="password" name="senha" placeholder="Senha" required>
                <button class="btnLogin" type="submit">Criar</button>
            </form>
        <div class="msg" id="msg"></div>
        </div>
    </div>
    
    <script type="module" src="./js/loginCriar.js"></script>
</body>
</html>
