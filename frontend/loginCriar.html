<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Criar</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./loginStyle.css">
    <link rel="stylesheet" href="./navbar.css">
    <link rel="stylesheet" href="./responsividade.css">

</head>
<body>       
    <!-- Menu navegação inicio -->
    <nav class="wraperNavegacao" id="wraperNavegacao">
        <div class="painelInfoUser" id="painelInfoUser">
            <p id="painelNomeHmaburger">não logado</p>
            <p id="painelRoleHamburger">indefinido</p>
        </div>

        <p class="linkMenu menuHamburger" id="idMenuHamburger">&#9776;</p>

        <ul class="ulMenu" id="ulMenu">
        </ul>
    </nav>
    
    <script type="module" src="./navbar.js"></script>
    <!-- Menu navegação fim -->


    <div class="mainLogin">
        <div class="login-box">
            <h2>Login</h2>
            <form id="criarForm">
                <input type="text" id="username" placeholder="Usuário" required>
                <input type="text" id="estudio" name="estudio" placeholder="Estúdio" required>
                <input type="password" id="password" placeholder="Senha" required>
                <button class="btnLogin" type="submit">Criar</button>
            </form>
        <div class="msg" id="msg"></div>
        </div>
    </div>
    
    <script type="module" src="./menuHamburger/navegacao.js"></script>  
    <script type="module" src="./scryptLogin.js"></script>
</body>
</html>
