<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./assets/icones/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>

    <link rel="stylesheet" href="./assets/css/styleGeral.css">
    <link rel="stylesheet" href="./assets/css/responsividade.css">
    <link rel="stylesheet" href="./assets/css/navbar.css">
</head>
<body>
    <script type="module" src="./js/navbar.js"></script>
    <script type="module" src="./js/resetarSenha.js"></script>

    <main id="main">
        <div class="containerPainel" style="max-width: 520px; width: 92%; margin-top: 25px;">
            <h1 class="h1Login">Redefinir Senha</h1>
            <p style="font-size: 18px; color: #6b3f06; margin-top: 10px; text-align: center;">
                Digite sua nova senha para concluir a recuperacao.
            </p>

            <form id="resetarSenhaForm" style="display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 20px;">
                <input class="inputTexto" style="width: 320px;" type="password" name="novaSenha" id="novaSenha" placeholder="Nova senha" required minlength="6">
                <input class="inputTexto" style="width: 320px;" type="password" name="confirmarSenha" id="confirmarSenha" placeholder="Confirmar nova senha" required minlength="6">
                <button type="submit" style="width: 220px;">Redefinir Senha</button>
            </form>

            <p id="painelMensagem" style="margin-top: 14px; min-height: 24px; font-size: 16px; text-align: center;"></p>

            <a href="./login.html" style="margin-top: 14px; color: #6b3f06; text-align: center;">Voltar para o login</a>
        </div>
    </main>
</body>
</html>
