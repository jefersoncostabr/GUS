<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./assets/icones/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>

    <link rel="stylesheet" href="./assets/css/styleGeral.css">
    <link rel="stylesheet" href="./assets/css/responsividade.css">
</head>
<body>
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <script type="module" src="./js/navbar.js"></script>
    <script type="module" src="./js/resetarSenha.js"></script>

    <main id="main">
        <div class="containerPainel authPanel">
            <h1 class="h1Login">Redefinir Senha</h1>
            <p class="authIntro">
                Digite sua nova senha para concluir a recuperacao.
            </p>

            <form id="resetarSenhaForm" class="authForm">
                <input class="inputTexto authInput" type="password" name="novaSenha" id="novaSenha" placeholder="Nova senha" required minlength="6">
                <input class="inputTexto authInput" type="password" name="confirmarSenha" id="confirmarSenha" placeholder="Confirmar nova senha" required minlength="6">
                <button type="submit" class="authBtn">Redefinir Senha</button>
            </form>

            <p id="painelMensagem" class="authMessage"></p>

            <a class="authLink" href="./login.html">Voltar para o login</a>
        </div>
    </main>
</body>
</html>
