<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./assets/icones/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geral</title>

    <link rel="stylesheet" href="./assets/css/tabela.css">
    <link rel="stylesheet" href="./assets/css/styleGeral.css">
    <link rel="stylesheet" href="./assets/css/responsividade.css">
</head>
<body>
    <!-- Menu navegação inicio -->    
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <script type="module" src="./js/navbar.js"></script>
    
    <main id="main" class="mainComEspacoNavbar">
        <!-- <h1>Painel Geral</h1>    -->
        <div class="containerPainel" id="">
            <div class="containerBotoesTopo">
                <button class="btnSmall" id="limparImputsBtn">Limpar</button>
            </div>
            <div id="painelSaida"></div>
            <div class="formularioContainer">
                <div>
                    <label for="solicitante">Solicitante:</label>
                    <input class="inputTexto" type="text" id="solicitante" autocomplete="off"></label>
                </div>
                <div>
                    <label for="estudio">Estúdio:</label>
                    <select name="estudio" id="estudio" class="inputTexto selectMotivo">
                        <option value="">Selecione</option>
                    </select>
                </div>
                <div>
                    <label for="sala">Sala:</label>
                    <select class="inputNumerico" id="sala" style="min-width: 120px;">
                        <option value="">Selecione</option>
                    </select>
                </div>
                <div>
                    <label for="date">Dia:</label>
                    <input type="date" id="date" name="date" class="input" value="">
                </div>
                <div>
                    <label for="hora">Hora:</label>
                    <input class="inputNumerico" type="text" id="hora" placeholder="HH:MM" maxlength="5">
                </div>
                <div>
                <label for="motivo">Motivo:</label>
                    <select class="inputTexto selectMotivo" id="motivo">
                        <option value="">Selecione</option>
                        <!-- Opções carregadas dinamicamente via carregarMotivos.js -->
                    </select>
                </div>
                <div>
                    <label for="id" id="labelId">id:</label>
                    <input class="inputTexto" type="text" id="id" disabled></label>
                </div>

            </div>
			<div class="botoesInfContainer">
				<button class="btnSmall"  id="getUsosBtn">Ver</button>				
				<button class="btnSmall" id="adicionarUsoBtn">Adicionar</button>
				<button class="btnSmall" id="alterarReservaBtn">Alterar</button>
				<button class="btnSmall" id="excluirUsoBtn">Excluir</button>
			</div>
            
            <!-- <p id="painelMensagem"></p> -->
		</div>
        <div class="containerPainel" id="containerTabela">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;">
                <button class="btnSmall" id="btnMostrarAulasRegulares">Aulas Fixas</button>
                <span id="filtrosAtivos" style="font-size:0.70em;color:#555;"></span>
            </div>
            <div id="tableInner"></div>
            <div id="containerPaginacao"></div>
        </div>


    </main>
    
    <script type="module" src="./js/tabela.js"></script>
    <script type="module" src="./js/ver.js"></script>
    <script type="module" src="./js/adicionarUso.js"></script>
    <script type="module" src="./js/editarUso.js"></script>
    <script type="module" src="./js/apagarUso.js"></script>
    <script type="module" src="./js/limparImputs.js"></script>
    <script type="module" src="./js/carregarMotivos.js"></script>
    <script type="module" src="./js/carregarDadosUsuario.js"></script>
</body>
</html>
