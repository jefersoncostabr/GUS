<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="./assets/css/styleGeral.css">
    <link rel="stylesheet" href="./assets/css/responsividade.css">
</head>
<body>
    <!-- Menu navegação inicio -->    
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <script type="module" src="./js/navbar.js"></script>

    <script type="module" src="./js/login.js"></script>

    <main id="main">
        <div class="containerPainel">
            <h1 class="h1Login">Login</h1>
            <!-- Ajuste a action conforme sua rota de login no backend -->
            <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 20px;">
                <input class="inputTexto" type="text" name="solicitante" placeholder="Usuário" required>
                <input  id="loginForm" class="inputTexto" type="password" name="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p id="painelMensagem" style="margin-top: 10px; color: red;"></p>
        </div>
    </main>
</body>
</html>
