<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./assets/icones/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci Minha Senha</title>

    <link rel="stylesheet" href="./assets/css/styleGeral.css">
    <link rel="stylesheet" href="./assets/css/responsividade.css">
</head>
<body>
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <script type="module" src="./js/navbar.js"></script>
    <script type="module" src="./js/esqueciSenha.js"></script>

    <main id="main">
        <div class="containerPainel authPanel">
            <h1 class="h1Login">Recuperar Senha</h1>
            <p class="authIntro">
                Informe seu usuario e e-mail para receber o link de redefinicao.
            </p>

            <form id="esqueciSenhaForm" class="authForm">
                <input class="inputTexto authInput" type="text" name="solicitante" placeholder="Nome de usuario" required>
                <input class="inputTexto authInput" type="email" name="email" placeholder="E-mail cadastrado" required>
                <button type="submit" class="authBtn">Enviar Link</button>
            </form>

            <p id="painelMensagem" class="authMessage"></p>

            <a class="authLink" href="./login.html">Voltar para o login</a>
        </div>
    </main>
</body>
</html>
